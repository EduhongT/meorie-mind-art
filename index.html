<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>머리에 그리는® 마음그림 — 어르신과 함께하는 따뜻한 그림 활동</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC; --card:#FFFFFF; --ink:#2B2620; --muted:#6B6257; --line:#E6DCCB;
    --accent:#B5452B; --accent-soft:#F7E3DA; --green:#3F6B4A; --green-soft:#E3EDE2;
    --gold:#C88A1E; --blue:#4A78B8; --blue-soft:#E3ECF7; --fs:19px; --radius:18px;
  }
  body.big{ --fs:23px; }
  *{box-sizing:border-box}
  body{word-break:keep-all;overflow-wrap:break-word}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;font-size:var(--fs);line-height:1.6;-webkit-text-size-adjust:100%}
  button,select{font:inherit;color:inherit;cursor:pointer}
  .wrap{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
  .serif{font-family:"Gowun Batang","Noto Serif CJK KR",serif}
  header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:4px 0 14px;border-bottom:2px solid var(--line);margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;text-align:left}
  .brand img{width:78px;height:auto;display:block}
  .brand h1{font-family:"Gowun Batang",serif;font-size:1.4em;margin:0;line-height:1.2}
  .brand p{margin:0;color:var(--muted);font-size:.74em}
  .nav{display:flex;gap:6px;flex-wrap:wrap}
  .pill{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 15px;font-size:.8em;font-weight:500;min-height:46px}
  .pill[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn{border:none;border-radius:14px;padding:12px 22px;font-weight:700;min-height:54px;font-size:.92em}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-green{background:var(--green);color:#fff}
  .btn-ghost{background:var(--card);border:2px solid var(--line)}
  .btn:focus-visible,.pill:focus-visible,.card:focus-visible,.tool:focus-visible,.sw:focus-visible,.stage-btn:focus-visible{outline:4px solid var(--gold);outline-offset:2px}

  .stagebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:8px 12px;margin-bottom:18px}
  .stagebar b{font-size:.85em;margin-right:4px}
  .stage-btn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 16px;font-weight:700;min-height:46px;font-size:.85em}
  .stage-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .stagebar small{color:var(--muted);font-size:.72em;flex-basis:100%}

  .today{display:grid;grid-template-columns:210px 1fr;gap:22px;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:20px;margin-bottom:18px;align-items:center}
  .label{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.72em;padding:3px 12px;border-radius:999px;margin-bottom:6px}
  .today h2{font-family:"Gowun Batang",serif;font-size:1.45em;margin:0 0 6px;line-height:1.3}
  .today p{margin:0 0 12px;color:var(--muted)}
  .weeknav{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .thumb{width:100%;aspect-ratio:1;border-radius:16px;background:#fff;border:2px solid var(--line);display:block}
  @media (max-width:640px){.today{grid-template-columns:1fr}.today .thumb{max-width:200px;margin:0 auto}}

  .use{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px}
  .use div{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 16px;font-size:.82em}
  .use b{display:block;font-size:1.05em;margin-bottom:2px}
  @media (max-width:640px){.use{grid-template-columns:1fr}}

  h3.sec{font-family:"Gowun Batang",serif;font-size:1.2em;margin:6px 0 10px}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  @media (max-width:480px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
  .card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .12s,border-color .12s;position:relative}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .card.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .card h4{margin:0;font-size:.92em;line-height:1.35}
  .wk{align-self:flex-start;background:var(--ink);color:#fff;font-size:.64em;font-weight:700;padding:1px 9px;border-radius:999px;margin-top:2px}
  .meta{display:flex;gap:5px;flex-wrap:wrap;font-size:.66em}
  .tag{padding:2px 9px;border-radius:999px;background:var(--green-soft);color:var(--green);font-weight:700}
  .tag.lv1{background:#E6F2E2;color:#2F6A2C}.tag.lv2{background:#FDF0D5;color:#8A5A00}.tag.lv3{background:#F7E0DA;color:#A33A22}
  .tag.art{background:var(--blue-soft);color:var(--blue)}
  .tag.plain{background:#F0EBE2;color:var(--muted)}

  .lesson-head{display:grid;grid-template-columns:240px 1fr;gap:22px;align-items:start;margin-bottom:20px}
  @media (max-width:700px){.lesson-head{grid-template-columns:1fr}.lesson-head .thumb{max-width:220px}}
  .lesson-head h2{font-family:"Gowun Batang",serif;font-size:1.55em;margin:4px 0 8px;line-height:1.3}
  .goal{background:var(--green-soft);border-radius:14px;padding:10px 14px;margin:10px 0}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .box{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:14px}
  .box h3{margin:0 0 10px;font-size:1.02em;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .box h3 .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-size:.8em}
  .box h3 small{font-weight:400;color:var(--muted);font-size:.72em}
  .varybox{background:#FFF8E6;border-color:#F0DDB0}
  ul.vary{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  ul.vary li{background:#fff;border:2px solid #F0DDB0;border-radius:12px;padding:8px 10px;font-size:.86em;line-height:1.45}
  ul.vary li::before{content:'✎ ';color:var(--gold);font-weight:700}
  @media (max-width:600px){ul.vary{grid-template-columns:1fr;gap:6px}ul.vary li{padding:6px 10px}}
  .artbox{background:var(--blue-soft);border-color:#C9D9EE}
  .artbox .who{font-weight:700;color:var(--blue)}
  .stages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media (max-width:700px){.stages{grid-template-columns:1fr}}
  .stage{border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:.84em;opacity:.6}
  .stage.on{opacity:1;border-color:var(--accent);background:var(--accent-soft)}
  .stage b{display:block;font-size:1.05em}
  .stage .who{color:var(--muted);font-size:.9em}
  ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
  ol.steps li{counter-increment:s;position:relative;padding:9px 0 9px 50px;border-bottom:1px dashed var(--line)}
  ol.steps li:last-child{border-bottom:none}
  ol.steps li::before{content:counter(s);position:absolute;left:0;top:9px;width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:grid;place-items:center}
  .say{display:block;color:var(--accent);font-weight:500;margin-top:2px}
  ul.talk{margin:0;padding-left:1.1em}
  ul.talk li{margin:5px 0}
  .praise{font-family:"Gowun Batang",serif;font-size:1.12em;color:var(--green)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media (max-width:700px){.two{grid-template-columns:1fr}}
  .order{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  @media (max-width:480px){.order{grid-template-columns:1fr 1fr}}
  .order figure{margin:0}
  .order canvas{width:100%;aspect-ratio:1;border:2px solid var(--line);border-radius:14px;display:block;background:#fff}
  .order figcaption{font-size:.78em;margin-top:6px;line-height:1.45}
  .order figcaption b{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;margin-right:6px;font-size:.85em}
  .pager{display:flex;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}

  /* 그리기 */
  .draw{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;z-index:10}
  .draw-bar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:2px solid var(--line);background:var(--card)}
  .draw-bar h2{margin:0;font-size:.92em;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .draw-bar .btn{min-height:46px;padding:6px 14px}
  .draw-body{flex:1;display:flex;gap:12px;padding:10px;min-height:0}
  .canvas-holder{flex:1;display:grid;place-items:center;min-width:0;min-height:0}
  canvas#pad{background:#fff;border-radius:14px;box-shadow:0 0 0 2px var(--line);touch-action:none;display:block}
  .tools{display:flex;flex-direction:column;gap:10px;width:310px;overflow-y:auto}
  .tools .row{display:flex;flex-wrap:wrap;gap:6px}
  .tool{flex:1;min-width:64px;min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:.7em;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;padding:4px}
  .tool[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tool svg{width:24px;height:24px;margin-bottom:2px}
  .swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .sw{border:3px solid transparent;border-radius:12px;background:none;padding:3px 1px;display:flex;flex-direction:column;align-items:center;font-size:.6em;font-weight:500}
  .sw span.c{width:42px;height:42px;border-radius:50%;display:block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
  .sw[aria-pressed="true"]{border-color:var(--ink);background:var(--card)}
  .hint{font-size:.7em;color:var(--muted);background:var(--card);border-radius:12px;padding:8px 10px;border:2px dashed var(--line)}
  @media (orientation:portrait),(max-width:820px){
    .draw-body{flex-direction:column;padding:6px 8px 8px;gap:6px}
    .canvas-holder{flex:1 1 auto;min-height:170px}
    .draw-body{overflow-y:auto}
    .tools{width:100%;flex:none;gap:6px;overflow:visible;max-height:none}
    .tools > *{flex-shrink:0}
    .tools .row{flex-wrap:nowrap;gap:5px}
    .toolrow{display:grid!important;grid-template-columns:repeat(4,1fr)}
    .toolrow .tool{flex-direction:row;gap:4px;min-height:40px;font-size:.66em;padding:2px 4px;white-space:nowrap}
    .toolrow .tool svg{width:18px;height:18px;margin:0;flex:none}
    .tool{flex:1;min-height:38px;font-size:.64em;min-width:0;padding:2px}
    .tool svg{width:18px;height:18px}
    .tools .row:not(.toolrow) .tool{flex-direction:row;gap:3px}
    .tools .row:not(.toolrow) .tool svg{margin:0}
    .swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:2px 4px}
    .sw{font-size:.56em;padding:1px 0;border-width:2px;line-height:1.25}
    .sw span.c{width:28px;height:28px}
    .hint{display:none}
    .draw-bar{padding:6px 8px}
    .draw-bar .btn{min-height:42px;padding:4px 12px;font-size:.85em}
    .draw-bar h2{font-size:.82em}
  }

  @media (orientation:portrait) and (max-height:720px),(max-width:820px) and (max-height:720px){
    .draw-bar{padding:4px 8px}
    .draw-bar .btn{min-height:38px;font-size:.8em}
    .draw-body{padding:4px 8px 6px;gap:5px}
    .tools{gap:4px}
    .toolrow .tool,.tool{min-height:34px;font-size:.62em}
    .tool svg,.toolrow .tool svg{width:16px;height:16px}
    .sw{font-size:0;padding:1px 0;border-width:2px}
    .sw span.c{width:26px;height:26px}
    .swatches{gap:2px 4px}
  }
  .modal{position:fixed;inset:0;background:rgba(43,38,32,.55);display:grid;place-items:center;z-index:20;padding:20px}
  .modal-card{background:var(--card);border-radius:24px;padding:24px 22px;max-width:520px;width:100%;text-align:center}
  .modal-card img.char{width:120px}
  .modal-card h2{font-family:"Gowun Batang",serif;font-size:1.7em;margin:4px 0 8px;color:var(--accent)}
  .modal-card .actions{justify-content:center}

  .empty{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:30px;text-align:center;color:var(--muted)}

  .guide-list{display:grid;gap:12px}
  .guide-item{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:14px 18px}
  .guide-item b{color:var(--accent)}
  table.plan{width:100%;border-collapse:collapse;background:var(--card);font-size:.8em;border-radius:12px;overflow:hidden}
  table.plan td,table.plan th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
  table.plan th{background:#F3ECDF}

  footer.brandfoot{margin-top:40px;padding-top:22px;border-top:2px solid var(--line);text-align:center;color:var(--muted);font-size:.78em}
  footer.brandfoot img{width:150px;display:block;margin:0 auto 10px}
  footer.brandfoot p{margin:4px 0}
  /* ===== 정돈 & 스마트폰 ===== */
  .stage-row{display:flex;align-items:center;gap:10px;width:100%}
  .mob{display:none}
  table.plan td:first-child{white-space:nowrap;vertical-align:top}
  table.plan td div{padding:1px 0}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:1;max-width:360px}
  .stage-btn{width:100%}
  .today{display:block}
  .today-head{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center}
  .today .goaltxt{margin:14px 0 0;color:var(--muted)}
  .eq2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;max-width:460px}
  .eq3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;max-width:460px}
  .eq2 .btn,.eq3 .pill{width:100%}
  .filters.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .filters.scroll::-webkit-scrollbar{display:none}
  .filters.scroll .pill{flex:none}
  .card h4{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
  .cmeta{display:flex;align-items:center;gap:6px;font-size:.68em;color:var(--muted);white-space:nowrap;overflow:hidden}
  .cmeta .st{font-weight:700;letter-spacing:-1px}
  .cmeta .st.lv1{color:#2F6A2C}.cmeta .st.lv2{color:#B07800}.cmeta .st.lv3{color:#A33A22}
  .cmeta .dot{width:3px;height:3px;border-radius:50%;background:#C9BCA6;flex:none}
  .cmeta .ty.art{color:var(--blue);font-weight:700}
  .lesson-head{display:grid;grid-template-columns:170px 1fr;gap:20px;align-items:center;margin-bottom:14px}
  .lesson-head h2{margin:4px 0 8px}
  .lesson-info{margin-bottom:16px}
  .lesson-info .goal{margin:0 0 10px}
  .lesson-info .eq2{max-width:520px}
  .stabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
  .stabs button{border:2px solid var(--line);background:#fff;border-radius:12px;min-height:46px;font-weight:700;font-size:.85em}
  .stabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .spanel{background:var(--accent-soft);border-radius:14px;padding:12px 14px;font-size:.9em}
  .spanel .who{color:var(--muted);font-size:.9em;display:block;margin-bottom:2px}
  .spanel .adv{margin-top:8px;padding-top:8px;border-top:1px dashed #E3BBAE}
  .spanel .adv b{color:var(--accent)}
  .order figcaption{display:flex;gap:8px;align-items:flex-start}
  .order figcaption b{flex:none;margin:1px 0 0}
  .pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pager .btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-width:0;padding:10px 14px}
  .pager .btn.next{align-items:flex-end;text-align:right}
  .pager .btn small{font-weight:500;color:var(--muted);font-size:.78em}
  .pager .btn span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9em}
  @media (max-width:600px){
    :root{--fs:16px}
    .wrap{padding:12px 14px 30px}
    header.top{gap:10px;padding-bottom:12px;margin-bottom:12px}
    .brand{width:100%;justify-content:center}
    .brand img{width:62px}
    .brand h1{font-size:1.32em}
    .nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
    .nav .pill{padding:6px 2px;font-size:.74em;min-height:44px;border-radius:12px;white-space:nowrap}
    .stagebar{padding:10px 12px;margin-bottom:14px}
    .stage-row b{font-size:.8em;white-space:nowrap}
    .seg{max-width:none}
    .stagebar small{font-size:.74em;line-height:1.5}
    .today{padding:16px;border-radius:20px}
    .today-head{grid-template-columns:112px 1fr;gap:14px}
    .today h2{font-size:1.28em}
    .today .goaltxt{font-size:.92em;margin-top:12px}
    .eq2,.eq3{max-width:none}
    .use{gap:10px;margin-bottom:18px}
    .card{padding:10px;gap:5px;border-radius:16px}
    .wk{font-size:.62em;padding:0 8px}
    .card h4{font-size:.84em;min-height:2.6em;line-height:1.3}
    .cmeta{font-size:.62em;gap:4px}
    .grid{gap:8px}
    .filters .pill,.eq3 .pill{font-size:.78em;min-height:40px;padding:4px 13px}
    h3.sec{font-size:1.1em}
    .lesson-head{grid-template-columns:112px 1fr;gap:14px}
    .lesson-head h2{font-size:1.3em}
    .lesson-head .thumb{max-width:none}
    .box{padding:14px;border-radius:16px}
    .box h3{font-size:1em}
    .box h3 small{flex-basis:100%;margin-top:-4px}
    .mob{display:inline}
    .order{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:4px;scrollbar-width:none}
    .order::-webkit-scrollbar{display:none}
    .order figure{flex:0 0 64%;scroll-snap-align:start}
    ol.steps li{padding-left:46px}
    .actions{gap:8px}
    footer.brandfoot{font-size:.74em}
    table.plan{font-size:.74em}
  }
  .mhbanner{display:block;width:100%;text-align:left;border:2px solid #C9D9EE;background:var(--blue-soft);border-radius:16px;padding:12px 16px;margin-bottom:16px}
  .mhbanner b{display:block;color:var(--blue);font-size:.95em}
  .mhbanner span{font-size:.8em;color:var(--muted)}
  .mhlede{color:var(--muted);margin:0 0 12px;font-size:.88em}
  .mhmean{margin:0;font-size:.68em;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
  .filters .pill small{opacity:.6;font-weight:400}
  .mhcats{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;margin-bottom:14px}
  .mhcats .pill{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;padding:6px 2px;border-radius:12px;min-height:52px;white-space:nowrap;font-size:.76em}
  .mhcats .pill small{font-size:.82em;opacity:.65;font-weight:400}
  @media (max-width:900px){.mhcats{grid-template-columns:repeat(4,minmax(0,1fr))}}
  sup.tm{font-family:"Noto Sans KR",sans-serif;font-size:.42em;font-weight:500;vertical-align:super;margin-left:1px;line-height:0}
  footer.brandfoot .legal{margin-top:8px;font-size:.9em;opacity:.8}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="drawLayer" class="hidden"></div>

  ctx.restore();
}
function link(ctx, pts, from, to, close){
  ctx.beginPath(); ctx.moveTo(pts[from][0],pts[from][1]);
  for(let i=from+1;i<=to;i++) ctx.lineTo(pts[i][0],pts[i][1]);
  if(close) ctx.lineTo(pts[0][0],pts[0][1]);
  ctx.stroke();
}

/* opt: {upto: 몇 번째 단계까지, hi: 강조할 단계, sheet: 활동지용(정답선 제외)} */
function renderTemplate(ctx, key, size, opt){
  opt = opt||{};
  const parts = T[key]||[];
  const upto = opt.upto ?? parts.length-1;
  ctx.save();
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,size,size);
  const pad = opt.pad||0; if(pad) ctx.translate(size*pad,size*pad);
  const s = size/W*(1-2*pad); ctx.scale(s,s);
  ctx.lineJoin='round'; ctx.lineCap='round';
  parts.forEach((p,i)=>{
    if(i>upto) return;
    if(p[2] && !opt.steps) return;           // 점잇기 정답선은 활동지·그림판에서 숨김
    const isHi = i===opt.hi;
    ctx.strokeStyle = isHi ? '#D23B1F' : (opt.hi!=null ? '#9A928A' : '#222');
    ctx.lineWidth = isHi ? 7 : 5;
    p[1](ctx);
  });
  ctx.restore();
}

function at(c,x,y,s,fn,rot){ c.save(); c.translate(x,y); if(rot) c.rotate(rot); if(s!==1) c.scale(s,s); fn(); c.restore(); }
function mirrorAt(c,cx,fn){ fn(); c.save(); c.translate(2*cx,0); c.scale(-1,1); fn(); c.restore(); }
function ring(c,x,y,rin,rout,n,off){
  const w=(rout-rin)*0.42;
  at(c,x,y,1,()=>{ for(let i=0;i<n;i++){ c.save(); c.rotate((off||0)+i*2*Math.PI/n);
    P(c,`M0 ${-rin} C${w} ${-rin-(rout-rin)*0.3} ${w*0.9} ${-rin-(rout-rin)*0.75} 0 ${-rout} C${-w*0.9} ${-rin-(rout-rin)*0.75} ${-w} ${-rin-(rout-rin)*0.3} 0 ${-rin} Z`); c.restore(); } });
}
function petals5(c,x,y,r,off){
  at(c,x,y,1,()=>{ for(let i=0;i<5;i++){ c.save(); c.rotate((off||0)+i*2*Math.PI/5);
    P(c,`M0 0 C${-r*0.55} ${-r*0.25} ${-r*0.62} ${-r*0.95} 0 ${-r} C${r*0.62} ${-r*0.95} ${r*0.55} ${-r*0.25} 0 0`); c.restore(); } });
}
function spiral(c,x,y,r,turns){
  c.beginPath(); const N=120*turns;
  for(let i=0;i<=N;i++){ const t=i/N, a=t*turns*2*Math.PI, rr=r*(0.08+0.92*t); const px=x+rr*Math.cos(a), py=y+rr*Math.sin(a); i?c.lineTo(px,py):c.moveTo(px,py); }
  c.stroke();
}
function star5(c,x,y,r){ c.beginPath(); for(let i=0;i<10;i++){ const rr=i%2?r*0.45:r, a=-Math.PI/2+i*Math.PI/5; const px=x+rr*Math.cos(a), py=y+rr*Math.sin(a); i?c.lineTo(px,py):c.moveTo(px,py);} c.closePath(); c.stroke(); }
function star4(c,x,y,r){ P(c,`M${x} ${y-r} Q${x} ${y} ${x+r} ${y} Q${x} ${y} ${x} ${y+r} Q${x} ${y} ${x-r} ${y} Q${x} ${y} ${x} ${y-r} Z`); }

function setupCanvas(fresh){
  const holder = document.getElementById('holder'), cv = document.getElementById('pad');
  const r = holder.getBoundingClientRect();
  const size = Math.max(160, Math.floor(Math.min(r.width, r.height) - 6));
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  let old = null;
  if(!fresh && D.cv){ old = document.createElement('canvas'); old.width=D.cv.width; old.height=D.cv.height; old.getContext('2d').drawImage(D.cv,0,0); }
  cv.style.width = size+'px'; cv.style.height = size+'px';
  cv.width = Math.round(size*dpr); cv.height = Math.round(size*dpr);
  D.cv = cv; D.ctx = cv.getContext('2d', {willReadFrequently:true}); D.px = cv.width; D.dpr = dpr; D.tex = {};
  if(old){ D.ctx.drawImage(old,0,0,cv.width,cv.height); D.history=[]; }
  else renderTemplate(D.ctx, D.lesson.tpl, cv.width, {pad:0.1});
  bindPad();
}
function syncTools(){
  drawLayer.querySelectorAll('[data-tool]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.tool===D.tool));
  drawLayer.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.size===D.size));
  drawLayer.querySelectorAll('[data-color]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.color===D.color));
}
function snapshot(){ D.history.push(D.ctx.getImageData(0,0,D.px,D.px)); if(D.history.length>15) D.history.shift(); }
function pos(e){ const r = D.cv.getBoundingClientRect(); return [(e.clientX-r.left)*(D.cv.width/r.width), (e.clientY-r.top)*(D.cv.height/r.height)]; }
function unit(){ return D.dpr*(D.px/D.dpr/520); }
function bindPad(){
  const cv = D.cv;
  cv.onpointerdown = e=>{
    e.preventDefault(); const p = pos(e);
    if(D.tool==='fill'){ snapshot(); floodFill(Math.floor(p[0]),Math.floor(p[1]), D.color); return; }
    snapshot();
    if(['flower','star','heart'].includes(D.tool)){ stamp(p); return; }
    D.drawing = true; D.last = p;
    try{ cv.setPointerCapture(e.pointerId); }catch(_){}
    stroke(p,p);
  };
  cv.onpointermove = e=>{
    if(!D.drawing) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    evs.forEach(ev=>{ const p = pos(ev); stroke(D.last,p); D.last = p; });
  };
  cv.onpointerup = cv.onpointercancel = ()=>{ D.drawing=false; D.last=null; };
}
function texture(color, kind){
  const key = color+kind; if(D.tex[key]) return D.tex[key];
  const n = 64, c = document.createElement('canvas'); c.width=c.height=n; const x=c.getContext('2d');
  const img = x.createImageData(n,n); const [r,g,b] = hexRgb(color);
  for(let i=0;i<n*n;i++){ const k=i*4; img.data[k]=r; img.data[k+1]=g; img.data[k+2]=b;
    const q=Math.random();
    img.data[k+3] = kind==='pencil' ? (q<0.6? 150+q*170 : 30) : (q<0.85? 170+q*100 : 60); }
  x.putImageData(img,0,0);
  return D.tex[key] = D.ctx.createPattern(c,'repeat');
}
function stroke(a,b){
  const ctx = D.ctx, u = unit(); let w = D.size*u, style = D.color;
  if(D.tool==='eraser'){ style='#ffffff'; w*=1.6; }
  else if(D.tool==='pencil'){ style=texture(D.color,'pencil'); w*=0.55; }
  else if(D.tool==='pastel'){ style=texture(D.color,'pastel'); w*=1.5; }
  ctx.strokeStyle=style; ctx.lineWidth=w; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
}
function stamp(p){
  const c = D.ctx, s = D.size*unit()*0.11;
  c.save(); c.translate(p[0],p[1]); c.scale(s,s); c.fillStyle=D.color; c.strokeStyle='rgba(0,0,0,.25)'; c.lineWidth=1.2;
  if(D.tool==='star'){ c.beginPath(); for(let i=0;i<10;i++){ const r=i%2?9:21, a=-Math.PI/2+i*Math.PI/5; c.lineTo(r*Math.cos(a), r*Math.sin(a)); } c.closePath(); c.fill(); c.stroke(); }
  else if(D.tool==='heart'){ const h=new Path2D("M0 18 C-26 2 -24 -18 -10 -18 C-4 -18 0 -12 0 -9 C0 -12 4 -18 10 -18 C24 -18 26 2 0 18 Z"); c.fill(h); c.stroke(h); }
  else { for(let k=0;k<5;k++){ const a=-Math.PI/2+k*2*Math.PI/5; c.beginPath(); c.arc(11*Math.cos(a),11*Math.sin(a),9,0,7); c.fill(); c.stroke(); } c.beginPath(); c.arc(0,0,7,0,7); c.fillStyle='#FDD835'; c.fill(); c.stroke(); }
  c.restore();
}
function hexRgb(h){ const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function floodFill(x,y,hex){
  const w=D.px, h=D.px; if(x<0||y<0||x>=w||y>=h) return;
  const img = D.ctx.getImageData(0,0,w,h); const d = img.data; const fc = hexRgb(hex);
  const i0 = (y*w+x)*4; const tr=d[i0], tg=d[i0+1], tb=d[i0+2];
  if(tr+tg+tb < 180){ D.history.pop(); return; }
  if(Math.abs(tr-fc[0])+Math.abs(tg-fc[1])+Math.abs(tb-fc[2]) < 12){ D.history.pop(); return; }
  const TOL = 110, match = i => Math.abs(d[i]-tr)+Math.abs(d[i+1]-tg)+Math.abs(d[i+2]-tb) < TOL;
  const seen = new Uint8Array(w*h), stack=[x,y];
  while(stack.length){
    let cy=stack.pop(), cx=stack.pop(), p = cy*w+cx;
    while(cx>=0 && !seen[p] && match(p*4)){ cx--; p--; }
    cx++; p++; let up=false, dn=false;
    while(cx<w && !seen[p] && match(p*4)){
      seen[p]=1; const k=p*4; d[k]=fc[0]; d[k+1]=fc[1]; d[k+2]=fc[2]; d[k+3]=255;
      if(cy>0){ const q=p-w; if(!seen[q] && match(q*4)){ if(!up){stack.push(cx,cy-1); up=true;} } else up=false; }
      if(cy<h-1){ const q=p+w; if(!seen[q] && match(q*4)){ if(!dn){stack.push(cx,cy+1); dn=true;} } else dn=false; }
      cx++; p++;
    }
  }
  for(let yy=1;yy<h-1;yy++) for(let xx=1;xx<w-1;xx++){
    const p=yy*w+xx; if(seen[p]) continue;
    if(seen[p-1]||seen[p+1]||seen[p-w]||seen[p+w]){
      const k=p*4, lum=(d[k]+d[k+1]+d[k+2])/3;
      if(lum>90){ const t=(lum-90)/165; for(let j=0;j<3;j++) d[k+j]=Math.round(d[k+j]*(1-t)+fc[j]*t*(d[k+j]/255)); }
    }
  }
  D.ctx.putImageData(img,0,0);
}
function closeDraw(){ drawLayer.className='hidden'; drawLayer.innerHTML=''; document.body.style.overflow=''; D.cv=null; }
function showPraise(){
  const l = D.lesson, m = document.getElementById('modalLayer');
  m.className='modal';
  m.innerHTML = `<div class="modal-card" role="dialog" aria-label="칭찬">
    <img class="char" src="${IMG_CHAR}" alt="감성이">
    <h2>참 잘하셨어요!</h2>
    <p class="praise">“${esc(l.praise)}”</p>
    <p style="color:var(--muted);font-size:.8em">그림을 보며 “${esc(l.talk[0])}” 하고 한 번 더 이야기 나눠 보세요.</p>
    <div class="actions">
      <button class="btn btn-ghost" data-act="keep">계속 그리기</button>
      <button class="btn btn-green" data-act="another">다른 활동</button>
    </div></div>`;
  speak('참 잘하셨어요! ' + l.praise);
}
function closeModal(){ const m=document.getElementById('modalLayer'); m.className='hidden'; m.innerHTML=''; }
function speak(text){
  try{ if(!('speechSynthesis' in window)) return false; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.lang='ko-KR'; u.rate=0.85; speechSynthesis.speak(u); return true; }catch(e){ return false; }
}

/* ================= 이벤트 ================= */
function go(view){ state.view=view; render(); window.scrollTo(0,0); }
document.addEventListener('click', e=>{
  const t = e.target.closest('button'); if(!t) return;
  const ds = t.dataset;
  if(ds.open){ state.lesson = LESSONS.find(l=>l.id===ds.open); state.week = state.lesson.w; go('lesson'); return; }
  if(ds.draw){ openDraw(LESSONS.find(l=>l.id===ds.draw)); return; }
  if(ds.mh){ openDraw(minhwaLesson(ds.mh)); return; }
  if(ds.mhcat){ state.mhcat=ds.mhcat; render(); return; }
  if(ds.week){ state.week=+ds.week; state.month=WEEK_MONTH[state.week-1]; render(); return; }
  if(ds.month!=null && ds.month!==''){ state.month=+ds.month; render(); return; }
  if(ds.kind){ state.kind=ds.kind; render(); return; }
  if(ds.stage){ const y=window.scrollY; state.stage=+ds.stage; store('mg-stage', ds.stage); render(); window.scrollTo(0,y); return; }
  if(ds.tool){ D.tool=ds.tool; syncTools(); return; }
  if(ds.size){ D.size=+ds.size; if(D.tool==='fill') D.tool='pencil'; syncTools(); return; }
  if(ds.color){ D.color=ds.color; if(D.tool==='eraser') D.tool = D.lesson.mode; syncTools(); return; }
  switch(ds.act){
    case 'home': go('home'); break;
    case 'art': go('art'); break;
    case 'minhwa': go('minhwa'); break;
    case 'guide': go('guide'); break;
    case 'speak': { const l=state.lesson; if(!speak(l.title+'. '+l.steps.map((s,i)=>(i+1)+'번. '+s[0]+' '+(s[1]||'')).join(' '))) t.textContent='이 기기에서는 읽어주기를 지원하지 않아요'; break; }
    case 'closeDraw': closeDraw(); break;
    case 'undo': if(D.history.length) D.ctx.putImageData(D.history.pop(),0,0); break;
    case 'reset': snapshot(); renderTemplate(D.ctx, D.lesson.tpl, D.px, {pad:0.1}); break;
    case 'done': showPraise(); break;
    case 'keep': closeModal(); break;
    case 'another': { const mh=D.lesson&&D.lesson.minhwa; closeModal(); closeDraw(); go(mh?'minhwa':'home'); break; }
  }
});
let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(D.cv && !drawLayer.classList.contains('hidden')) setupCanvas(false); else drawThumbs(); },200); });
render();
</script>
